save_preset:
  name: Save preset
  description: Saves the current PTZ position to a preset
  target:
    entity:
      domain: camera
      integration: tapo_control
  fields:
    name:
      description: "Name of the preset."
      example: "Entry Door"
      required: true
      name: Name
      selector:
        text:
delete_preset:
  name: Delete preset
  description: Deletes a preset
  target:
    entity:
      domain: camera
      integration: tapo_control
  fields:
    preset:
      description: "PTZ preset ID or a Name. See possible presets in entity attributes"
      example: "1"
      required: true
      name: Name
      selector:
        text:
set_record_plan:
  name: Set recording plan
  description: "Sets the camera recording schedule. Omitted days stay unchanged; an empty list clears a day. Times use the camera local time. Requires recording-plan support."
  target:
    entity:
      domain: camera
      integration: tapo_control
  fields:
    enabled:
      name: Enabled
      description: "Enable or disable recording without clearing the schedule."
      required: true
      selector:
        boolean:
    sunday:
      name: Sunday
      description: "List of HHMM-HHMM:mode periods (1 = continuous, 2 = motion). Use [] for no recording; omit to keep unchanged."
      example: ["0000-0700:1", "0700-2400:2"]
      selector:
        object:
    monday:
      name: Monday
      description: "List of HHMM-HHMM:mode periods (1 = continuous, 2 = motion). Use [] for no recording; omit to keep unchanged."
      example: ["0000-0700:1", "0700-2400:2"]
      selector:
        object:
    tuesday:
      name: Tuesday
      description: "List of HHMM-HHMM:mode periods (1 = continuous, 2 = motion). Use [] for no recording; omit to keep unchanged."
      example: ["0000-0700:1", "0700-2400:2"]
      selector:
        object:
    wednesday:
      name: Wednesday
      description: "List of HHMM-HHMM:mode periods (1 = continuous, 2 = motion). Use [] for no recording; omit to keep unchanged."
      example: ["0000-0700:1", "0700-2400:2"]
      selector:
        object:
    thursday:
      name: Thursday
      description: "List of HHMM-HHMM:mode periods (1 = continuous, 2 = motion). Use [] for no recording; omit to keep unchanged."
      example: ["0000-0700:1", "0700-2400:2"]
      selector:
        object:
    friday:
      name: Friday
      description: "List of HHMM-HHMM:mode periods (1 = continuous, 2 = motion). Use [] for no recording; omit to keep unchanged."
      example: ["0000-0700:1", "0700-2400:2"]
      selector:
        object:
    saturday:
